name: CI and Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/*/go.sum
      - name: Test and vet all modules
        run: make check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Lint all modules
        run: make lint

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Hub configuration
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_IMAGE" || { echo 'Set the DOCKERHUB_IMAGE repository variable.'; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set the DOCKERHUB_USERNAME repository variable.'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set the DOCKERHUB_TOKEN repository secret.'; exit 1; }
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'mock-ai-go' }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
          labels: |
            org.opencontainers.image.licenses=MIT
      - name: Validate release version
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test "$VERSION" = "${GITHUB_REF_NAME#v}" || { echo 'Release tags must use vMAJOR.MINOR.PATCH, optionally with a SemVer prerelease suffix.'; exit 1; }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
